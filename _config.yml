# _config.yml
title: Liam Wallace
email: Liam.Wallace05@Outlook.com
description: >-
  Final year Computer Science student at the University of St Andrews.
  Building scalable, high-performance software for data-intensive applications.
baseurl: ""
url: ""

github_username: Liam-A-Wallace

theme: minima
plugins:
  - jekyll-feed

sass:
  quiet_deps: true

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: "_projects"  # ← Applies to files in the _projects folder
      type: "projects"
    values:
      layout: "project"  # ← Now uses the page layout

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/